github:
    user: primuszp
    repo: lyz 
    token: deploy/github.token
    assets:
    - path: build/lyz.xpi
      type: application/x-xpinstall

git_release:
    remote: origin
    branch: release

version_strings:
- path: addon/manifest.json
  pattern: '("version": ")(?P<release>[^"]+)(")'
- path: deploy/updates.json
  pattern: '("version": ")(?P<release>[^"]+)(")'
- path: deploy/updates.json
  pattern: '("update_link": "https://github.com/primuszp/lyz/releases/download/v)(?P<release>[^/]+)(/lyz.xpi")'
- path: addon/install.rdf
  pattern: (<em:version>)(?P<release>.*)(</em:version>)
# Update the modern RDF entry manually; historical application entries stay pinned.
